[bar.default]
background_opacity = 0.62000000476837158
capsule = true
capsule_radius = 6.0
center = [ "clock" ]
end = [ "media", "group:g1", "tray", "volume", "notifications", "session" ]
margin_edge = 0
margin_ends = 0
padding = 6
radius = 0
shadow = false
start = [ "control-center", "taskbar", "active_window" ]

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "ram", "cpu" ]
    opacity = 1.0
    padding = 6.0
    radius = 6.0

[config]

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "noctalia/screen_recorder:toggle"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 400.0
    box_width = 640.0
    cx = 1720.0
    cy = 456.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

[nightlight]
enabled = false

[osd]
offset_y = 80
position = "bottom_center"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/alan7a/Pictures/user-icon.jpg"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.screen_corners]
    enabled = false

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "s"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "e"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    enabled = true
    shortcut = "u"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "l"
    variant = "default"

[theme]
builtin = "Tokyo-Night"
source = "builtin"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "opencode", "zen-browser", "discord", "obsidian", "vscode", "steam", "fastfetch", "hyprtoolkit", "yazi" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/alan7a/Pictures/Wallpapers/space.jpg"

    [wallpaper.last]
    path = "/home/alan7a/Pictures/Wallpapers/space.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/alan7a/Pictures/Wallpapers/space.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/alan7a/Pictures/Wallpapers/space.jpg"

[widget.clock]
color = "primary"
font_weight = 700
format = "{:%-I:%M %p - %A %b %-d}"

[widget.control-center]
glyph = "hyprland"

[widget.cpu]
capsule = true

[widget.media]
art_size = 33.0
hide_when_no_media = true
max_length = 379
title_scroll = "always"

[widget.ram]
capsule = true

[widget.taskbar]
group_by_workspace = true

[widget.workspaces]
label_source = "id"
show_labels = true
